<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Tipos de Variáveis - JavaScript</title>
</head>
<body>

  <script>

    let texto    = "Meu numero é 10";   // string
    let inteiro  = 10;                 // int (number)
    let decimal  = 3.14;              // float (number)
    let logico   = true;              // bolleano

    alert(
      "Variável: texto\n"   + "Valor: " + texto   + "\n" + "Tipo: " + typeof texto   + "\n\n" +
      "Variável: inteiro\n" + "Valor: " + inteiro  + "\n" + "Tipo: " + typeof inteiro  + "\n\n" +
      "Variável: decimal\n" + "Valor: " + decimal  + "\n" + "Tipo: " + typeof decimal  + "\n\n" +
      "Variável: logico\n"  + "Valor: " + logico   + "\n" + "Tipo: " + typeof logico
    );

    console.log("Variável: texto"   , "| Valor:", texto   , "| Tipo:", typeof texto);
    console.log("Variável: inteiro" , "| Valor:", inteiro  , "| Tipo:", typeof inteiro);
    console.log("Variável: decimal" , "| Valor:", decimal  , "| Tipo:", typeof decimal);
    console.log("Variável: logico"  , "| Valor:", logico   , "| Tipo:", typeof logico);

  </script>

</body>
</html>
