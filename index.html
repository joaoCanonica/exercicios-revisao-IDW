<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toyota Corolla Cross XRE</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="card">

    <div class="badge">Toyota · 2024</div>

    <h1 class="titulo">Corolla Cross XRE</h1>
    <p class="subtitulo">Aventura com sofisticação</p>

    <div class="img-wrapper">
      <img src="corolla.jpg" alt="Toyota Corolla Cross XRE 2024" class="imagem-carro"/>
    </div>

    <div class="specs">
      <div class="spec-item">
        <span class="spec-valor">2.0</span>
        <span class="spec-label">Hibrido</span>
      </div>
      <div class="spec-item">
        <span class="spec-valor">177</span>
        <span class="spec-label">Cavalos</span>
      </div>
      <div class="spec-item">
        <span class="spec-valor">CVT</span>
        <span class="spec-label">Câmbio automatico</span>
      </div>
    </div>

    <p class="descrição">
      O Corolla Cross XRE combina o DNA offroad com o conforto premium da Toyota.
      Design arrojado, tecnologia de ponta e desempenho para qualquer terreno.
    </p>

  </div>

</body>
</html>
