<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">

    <h1>Calculadora de IMC</h1>
    <p class="subtitulo">Índice de Massa Corporal</p>

    <label>Nome:</label>
    <input type="text" id="nome" placeholder="Digite seu nome" />

    <label>Altura (em cm):</label>
    <input type="number" id="altura" placeholder="Ex: 175" />

    <label>Peso (em kg):</label>
    <input type="number" id="peso" placeholder="Ex: 70" />

    <button onclick="calcularIMC()">Calcular IMC</button>

    <div class="resultado" id="resultado">
      <p id="textoResultado"></p>
      <span id="classificacao"></span>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
