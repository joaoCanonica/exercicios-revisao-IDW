<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Calculadora</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background-color: #16213e;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 {
      color: #ffffff;
      font-size: 26px;
      margin-bottom: 8px;
    }

    p {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      text-align: left;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #0f3460;
      color: #fff;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #e94560;
    }

    .operacoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-op {
      padding: 14px;
      border: 2px solid #333;
      border-radius: 10px;
      background-color: #0f3460;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-op:hover {
      border-color: #e94560;
      background-color: #e94560;
    }

    .btn-op.selecionado {
      border-color: #e94560;
      background-color: #e94560;
    }

    .btn-calcular {
      width: 100%;
      padding: 14px;
      background-color: #e94560;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-bottom: 24px;
    }

    .btn-calcular:hover {
      background-color: #c73652;
    }

    .resultado {
      background-color: #0f3460;
      border-radius: 10px;
      padding: 20px;
      display: none;
    }

    .resultado p {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .resultado span {
      color: #e94560;
      font-size: 36px;
      font-weight: bold;
    }

  </style>
</head>
<body>

  <div class="card">

    <h1>🧮 Calculadora</h1>
    <p>Selecione a operação e informe dois números</p>

    <label>Operação:</label>
    <div class="operacoes">
      <button class="btn-op" onclick="selecionarOp(this, '+')" >➕ Soma</button>
      <button class="btn-op" onclick="selecionarOp(this, '-')" >➖ Subtração</button>
      <button class="btn-op" onclick="selecionarOp(this, '*')" >✖️ Multiplicação</button>
      <button class="btn-op" onclick="selecionarOp(this, '/')" >➗ Divisão</button>
    </div>

    <label>Primeiro número:</label>
    <input type="number" id="num1" placeholder="Ex: 10" />

    <label>Segundo número:</label>
    <input type="number" id="num2" placeholder="Ex: 5" />

    <button class="btn-calcular" onclick="calcular()">Calcular</button>

    <div class="resultado" id="resultado">
      <p>Resultado da operação:</p>
      <span id="valorResultado"></span>
    </div>

  </div>

  <script>

    let operacaoSelecionada = null;

    function selecionarOp(botao, op) {
      document.querySelectorAll(".btn-op").forEach(btn => btn.classList.remove("selecionado"));

      botao.classList.add("selecionado");
      operacaoSelecionada = op;
    }

    function calcular() {
      let num1 = parseFloat(document.getElementById("num1").value);
      let num2 = parseFloat(document.getElementById("num2").value);

      if (operacaoSelecionada === null) {
        alert("⚠️ Selecione uma operação!");
        return;
      }

      if (isNaN(num1) || isNaN(num2)) {
        alert("⚠️ Preencha os dois números!");
        return;
      }

      if (operacaoSelecionada === "/" && num2 === 0) {
        alert("⚠️ Não é possível dividir por zero!");
        return;
      }

      let resultado;

      if (operacaoSelecionada === "+") resultado = num1 + num2;
      if (operacaoSelecionada === "-") resultado = num1 - num2;
      if (operacaoSelecionada === "*") resultado = num1 * num2;
      if (operacaoSelecionada === "/") resultado = num1 / num2;

      document.getElementById("valorResultado").textContent = resultado;
      document.getElementById("resultado").style.display = "block";

      let nomeOp = { "+": "Soma", "-": "Subtração", "*": "Multiplicação", "/": "Divisão" };
      alert("✅ " + nomeOp[operacaoSelecionada] + " de " + num1 + " e " + num2 + " = " + resultado);
    }

  </script>

</body>
</html>
